```yaml
name: Update Cricket Scores

'on':
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch cricket scores
        env:
          CRICKET_API_KEY: ${{ secrets.CRICKET_API_KEY }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.parse

          key = os.environ["CRICKET_API_KEY"]
          params = urllib.parse.urlencode({
              "apikey": key,
              "offset": "0"
          })
          url = "https://api.cricapi.com/v1/currentMatches?" + params 

          req = urllib.request.Request(url)
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)

          with open("matches.json", "w") as f:
              json.dump(data, f)

          print("Cricket data file updated.")
          PY

      - name: Save updated scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json
          git diff --cached --quiet || (
            git commit -m "Update cricket scores" &&
            git push
          )
```
