
name: Update Cricket Scores

'on':
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch cricket scores
        env:
          CRICKET_API_KEY: ${{ secrets.CRICKET_API_KEY }}
        run: |
          curl --fail --silent --show-error --get \
            "https://api.cricapi.com/v1/currentMatches" \
            --data-urlencode "apikey=${CRICKET_API_KEY}" \
            --data-urlencode "offset=0" \
            --output response.json

          python3 -c "import json; d=json.load(open('response.json')); d.pop('apikey', None); json.dump(d, open('matches.json','w'), indent=2)"

      - name: Save updated scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add matches.json
          if ! git diff --cached --quiet; then
            git commit -m "Update cricket scores"
            git push
          fi
