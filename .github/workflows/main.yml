name: Update Cricket Scores

'on':
workflow_dispatch:
schedule:
- cron: "*/15 * * * *"

permissions:
contents: write

jobs:
update:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4


  - name: Fetch cricket scores
    env:
      CRICKET_API_KEY: ${{ secrets.CRICKET_API_KEY }}
    run: |
      curl --fail --silent --show-error \
        "https://api.cricapi.com/v1/currentMatches?apikey=${CRICKET_API_KEY}&offset=0" \
        -o matches.json

  - name: Save updated scores
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add matches.json
      git diff --cached --quiet || (
        git commit -m "Update cricket scores" &&
        git push
      )

